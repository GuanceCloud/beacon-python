name: PR Labeler

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    if: github.repository == 'open-telemetry/opentelemetry-python-contrib'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6
        with:
          sync-labels: false

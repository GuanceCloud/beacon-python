name: Beacon Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beacon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check version and baseline
        run: python beacon/scripts/check-version.py
      - name: Build both Beacon packages
        run: |
          uv build --package beacon-otel --out-dir dist
          uv build --package beacon-profiling --out-dir dist
      - name: Check distribution metadata
        run: |
          uvx twine check dist/*
          python beacon/scripts/check-version.py --wheel dist/beacon_otel-*.whl --wheel dist/beacon_profiling-*.whl
      - name: Test installed wheels
        run: |
          uv venv .beacon-test-env
          uv pip install --python .beacon-test-env/bin/python --find-links dist 'beacon-otel[profiling,requests]' pytest
          .beacon-test-env/bin/python -m pytest -q beacon/tests beacon-otel/tests
          .beacon-test-env/bin/python -m pytest -q sdk-extension/beacon-profiling/tests
          .beacon-test-env/bin/beacon --version
